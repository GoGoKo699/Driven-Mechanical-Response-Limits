name: Mechanics checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: checks/package-lock.json
      - run: npm ci --prefix checks --ignore-scripts
      - run: python -m unittest discover -s checks -p 'test_check_docs.py'
      - run: python checks/check_docs.py
      - run: npm --prefix checks run check
      - run: python checks/run.py --output results.local.json
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
      - run: python checks/port_work.py --output port-work.local.json
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
      - run: python checks/scale_free.py --output scale-free.local.json
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
      - run: python checks/finite_mass.py --output finite-mass.local.json
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
      - run: python checks/capacitive_shunt.py --output capacitive-shunt.local.json
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
